[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "merci"
version = "0.1.0"
description = "Migration Engine for Referenced Composite Identifiers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Denis Savasteev" }
]

keywords = [
    "alembic",
    "migration",
    "sqlalchemy",
    "orm",
    "asyncio",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.19.1,<2"
]

[project.urls]
Homepage = "https://github.com/djsava/merci"
Repository = "https://github.com/djsava/merci"
Issues = "https://github.com/djsava/merci/issues"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.31,<1",
]

[dependency-groups]
dev = [
    "autopep8",
    "mypy",
    "pre-commit",
    "ruff"
]

[tool.setuptools.package-data]
merci = ["py.typed"]

[tool.setuptools.packages.find]
include = ["merci*"]
exclude = ["merci.demo*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "merci/demo/rev/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
